<meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <script>
        // Enable animation start states only when JS runs and the visitor hasn't asked for reduced motion.
        // If motion.js never initialises (blocked or failed), drop the class so nothing stays hidden.
        document.documentElement.classList.add('js');
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('js-motion');
            setTimeout(function () { if (!window.__motionReady) document.documentElement.classList.remove('js-motion'); }, 3000);
        }
    </script>
